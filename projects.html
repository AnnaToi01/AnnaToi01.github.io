        <!-- ============================================================
             THE BENCH
             A photo of my bench with my drawings laid over it. The photo covers
             the whole window like the home page; on screens shaped differently
             from the photo, the cropped part can be scrolled into view.

             Every drawing was exported on the same 1280x960 canvas as the photo,
             then cropped. Each one is placed in % of the scene, so the
             arrangement holds at any size. The numbers come from the crop:
             left = x / 1280, top = y / 960, width = crop width / 1280.

             Objects are plain <a href="#panel-id"> links and the panels open
             with :target - no JavaScript needed, deep links work, and the back
             button closes a panel.
             ============================================================ -->
        <section class="bench" id="bench" aria-labelledby="bench-title">
            <h1 id="bench-title" class="sr-only">Research</h1>
            <div class="bench-scene">
                <img class="bench-photo" src="assets/images/projects/web/background.jpg" alt="" width="1280" height="960">

                <a class="bench-item" href="#p-blackboard" data-label="modelling plasmids"
                   style="left: 5.547%; top: 0.833%; width: 33.203%;">
                    <img src="assets/images/projects/web/blackboard.webp" alt="Whiteboard: mathematical modeling of plasmids">
                </a>

                <a class="bench-item" href="#p-computer" data-label="MGEs &amp; pangenomes · now"
                   style="left: 54.375%; top: 24.896%; width: 33.203%;">
                    <img src="assets/images/projects/web/computer.webp" alt="Laptop: co-evolution of MGEs and pangenome evolution of E. coli">
                </a>

                <a class="bench-item" href="#p-pipettes" data-label="GFP landscapes"
                   style="left: 17.422%; top: 53.125%; width: 25.703%;">
                    <img src="assets/images/projects/web/gfps.webp" alt="Glowing jellyfish and GFP tube: GFP fitness landscapes">
                </a>

                <a class="bench-item" href="#p-mice" data-label="subretinal fibrosis"
                   style="left: 70.469%; top: 78.229%; width: 17.344%;">
                    <img src="assets/images/projects/web/mice.webp" alt="Mouse and laser: subretinal fibrosis">
                </a>

                <a class="bench-item" href="#p-intro" data-label="about my research"
                   style="left: 47.578%; top: 81.771%; width: 19.766%;">
                    <img src="assets/images/projects/web/intro.webp" alt="Made by Anna: how I got into research">
                </a>
            </div>
